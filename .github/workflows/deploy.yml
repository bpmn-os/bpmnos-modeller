name: Deploy modeller to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permissions required by the GitHub Pages deployment actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No npm cache: the repo intentionally has no lockfile (.npmrc: package-lock=false),
          # and actions/setup-node's npm cache requires a lockfile.

      # No lockfile -> use `npm install` (not `npm ci`). Add --legacy-peer-deps here only if a
      # peer-dependency conflict ever breaks the install.
      - run: npm install

      # Produces dist/ (less -> dist/app.css, webpack -> dist/app.js + copies index.html,
      # BPMNOS.svg, vendor/ and modules/ assets). index.html uses relative asset paths, so it
      # works under the project-pages subpath (…/bpmnos-modeller/) without a publicPath change.
      - run: npm run bundle

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
